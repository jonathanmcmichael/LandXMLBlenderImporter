name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump both together; the hash is from Blender's published blender-<version>.sha256.
  BLENDER_VERSION: "5.2.2"
  BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"

jobs:
  tests:
    name: Unit tests
    # Pushes already cover same-repo pull requests; only run PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # Blender 5.2's bundled Python
      - run: python -m pip install shapely==2.1.2
      - run: python -W error::DeprecationWarning -m unittest discover -s tests -v

  extension:
    name: Build and smoke-test extension
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          series="Blender${BLENDER_VERSION%.*}"
          for base in https://download.blender.org/release https://mirrors.ocf.berkeley.edu/blender/release; do
            curl -fsSL --retry 3 -o "$archive" "$base/$series/$archive" && break
          done
          echo "${BLENDER_SHA256}  $archive" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf "$archive" -C ~/blender --strip-components=1

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libice6 libsm6 libx11-6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1

      - name: Fetch wheels
        run: python3 scripts/fetch_wheels.py

      - name: Validate extension
        run: ~/blender/blender --command extension validate landxml_importer

      - name: Build per-platform ZIPs
        run: ~/blender/blender --command extension build --source-dir landxml_importer --output-dir dist --split-platforms

      - name: Smoke-test linux-x64 ZIP in Blender
        run: |
          export BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile"
          mkdir -p "$BLENDER_USER_RESOURCES"
          ~/blender/blender -b --factory-startup --python-exit-code 1 \
            --python scripts/blender_smoke_test.py -- dist/landxml_tin_importer-*-linux_x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('landxml_importer/blender_manifest.toml', 'rb'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract changelog section
        run: |
          awk -v heading="## ${VERSION} " 'index($0, heading) == 1 {found = 1; next} found && /^## / {exit} found' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no section for ${VERSION}"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          name: extension-zips
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
