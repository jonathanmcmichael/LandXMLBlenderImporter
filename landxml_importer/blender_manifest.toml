schema_version = "1.0.0"
id = "landxml_tin_importer"
version = "0.3.0"
name = "LandXML Importer"
tagline = "Import LandXML terrain and civil linework"
maintainer = "Jonathan McMichael"
type = "add-on"
website = "https://github.com/jonathanmcmichael/LandXMLBlenderImporter"
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
wheels = [
  "wheels/shapely-2.1.2-cp313-cp313-win_amd64.whl",
  "wheels/shapely-2.1.2-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "wheels/shapely-2.1.2-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.whl",
  "wheels/shapely-2.1.2-cp313-cp313-macosx_10_13_x86_64.whl",
  "wheels/shapely-2.1.2-cp313-cp313-macosx_11_0_arm64.whl",
]

[permissions]
files = "Read LandXML surface files selected by the user"

[build]
# An explicit `paths` list breaks `--split-platforms` in Blender 5.2 (wheel ordering assertion),
# so exclude non-shipping files by pattern instead.
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/*.zip",
]
